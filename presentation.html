<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="icon.png">
  <title>Deep Learning — M2</title>

  <!-- Reveal.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/night.css" />

  <!-- Code highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />

  <!-- KaTeX for math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />

  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0d0d1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Reveal container ───────────────────────────────────────── */
    .reveal {
      font-size: 22px; /* base — Reveal.js scale le tout automatiquement */
    }

    /* ── Slides ─────────────────────────────────────────────────── */
    .reveal .slides {
      text-align: left;
    }

    .reveal .slides section {
      /* Laisse Reveal.js gérer le scaling — pas de height fixe */
      padding: 20px 40px;
      text-align: left;
    }

    /* ── Typography ─────────────────────────────────────────────── */
    .reveal h1 {
      font-size: 1.8em;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4em;
      line-height: 1.2;
    }

    .reveal h2 {
      font-size: 1.3em;
      color: #a78bfa;
      border-bottom: 2px solid rgba(167,139,250,0.3);
      padding-bottom: 0.2em;
      margin-bottom: 0.5em;
    }

    .reveal h3 {
      font-size: 1.05em;
      color: #60a5fa;
      margin-bottom: 0.3em;
    }

    .reveal p {
      font-size: 0.85em;
      line-height: 1.6;
      color: #e2e8f0;
      margin: 0.3em 0;
    }

    .reveal li {
      font-size: 0.82em;
      line-height: 1.55;
      color: #cbd5e1;
      margin: 0.2em 0;
    }

    .reveal strong { color: #f0abfc; }
    .reveal em     { color: #7dd3fc; font-style: italic; }

    /* ── Code blocks ────────────────────────────────────────────── */
    .reveal pre {
      width: 100%;
      margin: 0.4em 0;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-size: 0.72em;
      /* Scrollable si vraiment trop long — dernier recours */
      max-height: 45vh;
      overflow-y: auto;
    }

    .reveal code {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.9em;
    }

    /* Inline code */
    .reveal p code, .reveal li code {
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 4px;
      padding: 0.1em 0.4em;
      font-size: 0.85em;
      color: #f0abfc;
    }

    /* ── Tables ─────────────────────────────────────────────────── */
    .reveal table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75em;
      margin: 0.5em 0;
    }

    .reveal table th {
      background: rgba(167,139,250,0.2);
      color: #a78bfa;
      padding: 6px 12px;
      border: 1px solid rgba(167,139,250,0.3);
      text-align: left;
    }

    .reveal table td {
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
    }

    .reveal table tr:nth-child(even) td {
      background: rgba(255,255,255,0.03);
    }

    /* ── Blockquotes ────────────────────────────────────────────── */
    .reveal blockquote {
      background: rgba(96,165,250,0.08);
      border-left: 4px solid #60a5fa;
      border-radius: 0 8px 8px 0;
      padding: 0.5em 1em;
      margin: 0.5em 0;
      font-size: 0.82em;
      color: #93c5fd;
      font-style: italic;
    }

    /* ── KaTeX math ─────────────────────────────────────────────── */
    .reveal .katex {
      font-size: 0.95em;
      color: #fde68a;
    }

    .reveal .katex-display {
      margin: 0.4em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* ── Progress bar ───────────────────────────────────────────── */
    .reveal .progress {
      background: rgba(167,139,250,0.2);
      height: 4px;
    }

    .reveal .progress span {
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
    }

    /* ── Slide number ───────────────────────────────────────────── */
    .reveal .slide-number {
      background: rgba(13,13,26,0.8);
      color: #a78bfa;
      font-size: 0.7em;
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* ── Navigation arrows ──────────────────────────────────────── */
    .reveal .controls {
      color: #a78bfa;
    }

    /* ── Back to syllabus button ────────────────────────────────── */
    #back-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9999;
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.4);
      color: #a78bfa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #back-btn:hover {
      background: rgba(167,139,250,0.3);
      color: #fff;
    }

    /* ── Loading overlay ────────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      gap: 16px;
    }

    #loading .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(167,139,250,0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #loading p {
      color: #a78bfa;
      font-size: 14px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading slides…</p>
  </div>

  <!-- Back to syllabus -->
  <a id="back-btn" href="syllabus.html">← Syllabus</a>

  <!-- Reveal.js wrapper -->
  <div class="reveal">
    <div class="slides">
      <!-- Markdown content injected here -->
      <section data-markdown id="md-section">
        <textarea data-template id="md-content"></textarea>
      </section>
    </div>
  </div>

  <!-- Reveal.js -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

  <!-- KaTeX -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script>
    // ── Auth guard ───────────────────────────────────────────────
    if (sessionStorage.getItem('dl_auth') !== '1') {
      window.location.href = 'index.html';
    }

    // ── Parse ?src= param ────────────────────────────────────────
    const params  = new URLSearchParams(window.location.search);
    const srcPath = params.get('src');

    if (!srcPath) {
      window.location.href = 'syllabus.html';
    } else {
      fetch(srcPath)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })
        .then(md => {
          document.getElementById('md-content').textContent = md;

          // ── Initialize Reveal.js ─────────────────────────────
          Reveal.initialize({
            // ── Dimensions : Reveal.js scale automatiquement
            // tout le contenu pour tenir dans la fenêtre
            width: 1100,
            height: 850,
            margin: 0.06,
            minScale: 0.1,   // autorise un zoom-out agressif si besoin
            maxScale: 2.0,

            // ── Comportement
            center: false,         // contenu aligné en haut, pas centré
            hash: true,            // URL #/slide pour partager
            slideNumber: 'c/t',    // numéro courant / total
            progress: true,
            controls: true,
            controlsTutorial: false,
            transition: 'slide',
            transitionSpeed: 'fast',

            // ── Plugins
            plugins: [RevealMarkdown, RevealHighlight, RevealNotes],

            // ── Markdown config
            markdown: {
              smartypants: true,
            },
          }).then(() => {
            // ── KaTeX rendering après que Reveal a parsé le MD
            renderMathInElement(document.querySelector('.reveal'), {
              delimiters: [
                { left: '$$', right: '$$', display: true  },
                { left: '$',  right: '$',  display: false },
              ],
              throwOnError: false,
            });

            // ── Hide loading overlay
            document.getElementById('loading').style.display = 'none';
          });
        })
        .catch(err => {
          document.getElementById('md-content').textContent =
            `# ❌ Error loading file\n\n\`${srcPath}\`\n\n${err.message}`;

          Reveal.initialize({
            width: 1100, height: 850,
            plugins: [RevealMarkdown],
          }).then(() => {
            document.getElementById('loading').style.display = 'none';
          });
        });
    }
  </script>
</body>
</html>
