<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep Learning — M2</title>

  <!-- Reveal.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/night.css" id="theme"/>
  <link rel="icon" type="image/x-icon" href="icon.png">

  <!-- Highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css"/>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>

  <style>
    :root {
      --accent: #00d4ff;
      --accent2: #a855f7;
      --bg-dark: #0d0d1a;
    }

    .reveal-viewport { background: var(--bg-dark); }

    .reveal .slides section {
      text-align: left;
    }

    .reveal h1, .reveal h2 {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .reveal h3 { color: var(--accent); }

    .reveal code {
      background: #1e1e2e;
      border-radius: 4px;
      padding: 2px 6px;
      color: #cdd6f4;
      font-size: 0.85em;
    }

    .reveal pre code {
      padding: 1em;
      font-size: 0.75em;
      line-height: 1.5;
    }

    .reveal blockquote {
      border-left: 4px solid var(--accent);
      background: rgba(0,212,255,0.07);
      padding: 0.5em 1em;
      border-radius: 0 8px 8px 0;
      font-style: normal;
      width: 100%;
    }

    .reveal ul li, .reveal ol li {
      margin-bottom: 0.4em;
      line-height: 1.6;
    }

    /* Pill badges */
    .tag {
      display: inline-block;
      background: rgba(0,212,255,0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.6em;
      margin: 2px;
      vertical-align: middle;
    }

    .tag.purple {
      background: rgba(168,85,247,0.15);
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .tag.green {
      background: rgba(34,197,94,0.15);
      border-color: #22c55e;
      color: #22c55e;
    }

    .tag.red {
      background: rgba(239,68,68,0.15);
      border-color: #ef4444;
      color: #ef4444;
    }

    /* Two-column layout */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5em;
      align-items: start;
    }

    .cols.ratio-3-2 { grid-template-columns: 3fr 2fr; }
    .cols.ratio-2-3 { grid-template-columns: 2fr 3fr; }

    /* Highlight box */
    .box {
      background: rgba(0,212,255,0.07);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 10px;
      padding: 0.8em 1.2em;
      margin: 0.5em 0;
    }

    .box.purple {
      background: rgba(168,85,247,0.07);
      border-color: rgba(168,85,247,0.3);
    }

    .box.warning {
      background: rgba(251,191,36,0.07);
      border-color: rgba(251,191,36,0.3);
    }

    /* Formula highlight */
    .formula {
      background: #1e1e2e;
      border-radius: 8px;
      padding: 0.8em 1.2em;
      text-align: center;
      margin: 0.6em 0;
      border: 1px solid rgba(168,85,247,0.4);
    }

    /* Nav bar */
    #nav-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(13,13,26,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,212,255,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4em 1.2em;
      font-size: 0.75em;
    }

    #nav-bar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #nav-bar a:hover { text-decoration: underline; }

    #nav-bar .chapter-title {
      color: rgba(255,255,255,0.6);
      font-size: 0.95em;
    }

    /* Push slides below nav */
    .reveal .slides { margin-top: 2em; }

    /* Progress bar color override */
    .reveal .progress { color: var(--accent); }

    /* Slide number */
    .reveal .slide-number { color: var(--accent); }
  </style>
</head>
<body>

  <!-- Top navigation bar -->
  <div id="nav-bar">
    <a href="index.html">⬅ Course Home</a>
    <span class="chapter-title" id="chapter-label">Deep Learning — M2</span>
    <a href="syllabus.html">📚 Syllabus</a>
  </div>

  <div class="reveal">
    <div class="slides">
      <!-- Markdown content loaded dynamically from ?src= param -->
      <section
        data-markdown
        data-separator="^\n---\n"
        data-separator-vertical="^\n--\n"
        data-separator-notes="^Note:"
        data-charset="utf-8">
      </section>
    </div>
  </div>

  <!-- Reveal.js core -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/math/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/search/search.js"></script>

  <script>
    // ── 1. Read ?src= parameter ──────────────────────────────────────────────
    const params  = new URLSearchParams(window.location.search);
    const srcFile = params.get('src');
 
    if (!srcFile) {
      document.querySelector('.slides section').setAttribute(
        'data-markdown', ''
      );
      document.querySelector('.slides section').innerHTML =
        '<textarea data-template># ⚠️ No source file specified\n\nUse `?src=path/to/file.md`</textarea>';
    } else {
      // Set the data-markdown attribute to the file path
      const section = document.querySelector('.slides section');
      section.setAttribute('data-markdown', srcFile);

      // Update chapter label from filename
      const parts = srcFile.split('/');
      const label = parts[parts.length - 1].replace('.md', '').replace(/_/g, ' ');
      document.getElementById('chapter-label').textContent =
        '📖 ' + label.charAt(0).toUpperCase() + label.slice(1);
    }

    // ── 2. Initialise Reveal ─────────────────────────────────────────────────
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      progress: true,
      center: false,
      transition: 'slide',
      transitionSpeed: 'fast',
      backgroundTransition: 'fade',

      // KaTeX math
      math: {
        renderer: 'KaTeX',
        katexScript:     'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
        katexStylesheet: 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
      },

      plugins: [
        RevealMarkdown,
        RevealHighlight,
        RevealNotes,
        RevealMath.KaTeX,
        RevealSearch,
      ],
    });
  </script>
</body>
</html>
